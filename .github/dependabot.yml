# Version-update intake only; security updates are outside cooldown.
# Ordinary/product/review gates still apply; Docker stays reviewed-only.
version: 2
updates:
  - package-ecosystem: "uv"
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      patch:
        update-types: ["patch"]
      minor:
        update-types: ["minor"]
  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 14
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
