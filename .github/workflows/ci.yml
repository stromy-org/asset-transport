# Self-contained on purpose — do NOT convert this back to a call into
# `stromy-org/stromy-org/.github/workflows/ci-python.yml`.
#
# Every other Python satellite calls that shared reusable workflow, and this repo
# did too until it went public. The control plane that hosts the shared workflow
# is PRIVATE and this repo is PUBLIC, so the call stops resolving the moment
# visibility flips: runs fail at 0s with a startup error and no jobs at all.
#
# Inlining is the right shape regardless of the mechanics: a public library must
# be buildable from its own contents by anyone who clones it. Proving a public
# package correct via a private workflow is a dependency its own consumers cannot
# satisfy. This repo went public for exactly that reason — so the public facade
# `stromy-org/stromy-workflows-mcp` can resolve it without private-build
# credentials — and shipping it with a private-only CI would have re-created the
# problem one level down.
#
# The cost is real and accepted: this file must be kept in step with
# ci-python.yml by hand. Keep it minimal so that stays cheap — this repo has no
# private git+URL dependencies and no `readiness.py`, so the App-token minting and
# control-plane fetching the shared workflow spends two jobs on have nothing to do
# here anyway.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-ci:
    # ci-dedup (inside the reusable workflow) reads the merged PR behind a push
    # and that PR's workflow runs. The org default token grants contents+packages
    # only, so without these the action 403s on every push and silently never
    # skips — the checks then run twice per change, which is the cost it exists to
    # remove. A called workflow inherits this job's grant and can only downgrade
    # it, so it has to be declared here rather than in ci-python.yml.
    permissions:
      contents: read
      packages: read
      pull-requests: read
      actions: read
    uses: stromy-org/stromy-org/.github/workflows/ci-python.yml@main
    with:
      source_package: "src/stromy_asset_transport"
    # Forward the org stromy-ci App secrets (CI_APP_ID / CI_APP_PRIVATE_KEY)
    # so the reusable workflow can clone private deps. No-op if absent.
    secrets: inherit
