# Self-contained on purpose — do NOT convert this back to a call into
# `stromy-org/stromy-org/.github/workflows/ci-python.yml`.
#
# Every other Python satellite calls that shared reusable workflow, and this repo
# did too until it went public. The control plane that hosts the shared workflow
# is PRIVATE and this repo is PUBLIC, so the call stops resolving the moment
# visibility flips: runs fail at 0s with a startup error and no jobs at all.
#
# Inlining is the right shape regardless of the mechanics: a public library must
# be buildable from its own contents by anyone who clones it. Proving a public
# package correct via a private workflow is a dependency its own consumers cannot
# satisfy. This repo went public for exactly that reason — so the public facade
# `stromy-org/stromy-workflows-mcp` can resolve it without private-build
# credentials — and shipping it with a private-only CI would have re-created the
# problem one level down.
#
# The native workflow is generated by the public Python library Copier template.
# Keep ci_adapter=generated when updating. This repo has no
# private git+URL dependencies and no `readiness.py`, so the App-token minting and
# control-plane fetching the shared workflow spends two jobs on have nothing to do
# here anyway.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


# The shared adapter inherits ci-python's caller-scoped group; the generated
# one runs its checks inline, so it cancels superseded PR runs itself and
# never cancels a default-branch run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:

  python-ci:
    if: ${{ !github.event.repository.private || vars.CI_MODE_SATELLITE != 'off' }}
    runs-on: ${{ fromJSON((github.event.repository.private && (((github.event_name != 'pull_request' || github.event.pull_request.user.login == 'dependabot[bot]') && vars.CI_RUNS_ON_SATELLITE_MAIN) || (github.event_name == 'pull_request' && vars.CI_RUNS_ON_SATELLITE_PR) || vars.CI_RUNS_ON_SATELLITE)) || '"ubuntu-latest"') }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: ${{ !contains(fromJSON((github.event.repository.private && (((github.event_name != 'pull_request' || github.event.pull_request.user.login == 'dependabot[bot]') && vars.CI_RUNS_ON_SATELLITE_MAIN) || (github.event_name == 'pull_request' && vars.CI_RUNS_ON_SATELLITE_PR) || vars.CI_RUNS_ON_SATELLITE)) || '"ubuntu-latest"'), 'self-hosted') }}
      - run: uv python install 3.11
      - name: Install
        timeout-minutes: 10
        run: uv sync --locked --all-extras
      - name: Lint
        run: uv run ruff check
      - name: Type check
        run: uv run pyright src/stromy_asset_transport
      - name: Unit tests
        run: |
          rm -f .unit-junit.xml
          uv run pytest tests/unit --junitxml=.unit-junit.xml
          if [ -f .github/test-contract.yml ]; then
            uv run --no-project --python 3.12 --with pyyaml --with jsonschema python scripts/ci/suite_execution.py --step tests --report .unit-junit.xml --returncode 0
          fi
      - name: Contract tests
        run: |
          rm -f .contract-junit.xml
          uv run pytest tests/contract --junitxml=.contract-junit.xml
          if [ -f .github/test-contract.yml ]; then
            uv run --no-project --python 3.12 --with pyyaml --with jsonschema python scripts/ci/suite_execution.py --step contract --report .contract-junit.xml --returncode 0
          fi
      - name: Integration tests
        # Every library ships tests/integration. A repo that grows tests there
        # (a real PostgreSQL through testcontainers, say) runs them here, so an
        # update to this file never leaves them with nowhere to run. An empty
        # directory is reported, not collected.
        run: |
          if ! find tests/integration -name 'test_*.py' -print -quit 2>/dev/null | grep -q .; then
            echo "tests/integration holds no tests; nothing to run."
            exit 0
          fi
          uv run pytest tests/integration
      - run: uv lock --check
      - run: uv build

