# Thin caller for the versioned control-plane engine. Keep behavior in stromy-org,
# and archetype-specific regeneration in scripts/post-copier-update.sh.
name: Scheduled template sync

on:
  schedule:
    - cron: "0 7 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  copier-update:
    uses: stromy-org/stromy-org/.github/workflows/copier-update.yml@copier-fleet-v1
    with:
      template-name: python-library-template
      engine-ref: copier-fleet-v1
    secrets: inherit

