# GENERATED by stromy-org scripts/render-org-core.py (ORG-PLAN-331 C4). Do not edit;
# re-render from the stromy-org root instead.
#
# The org-core block in AGENTS.md must equal its inert reference, and the
# generated CLAUDE.md / copilot-instructions.md must equal what AGENTS.md
# renders to. Both checks are standard-library Python with no install step.
# Cost: one billed minute per PR or main push that touches these paths.
name: org-core

on:
  pull_request:
    paths: &paths
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.github/copilot-instructions.md'
      - '.agent-overrides/**'
      - '.agents/org-core.md'
      - 'scripts/check-org-core.py'
      - 'scripts/render-agent-md.py'
      - 'scripts/instruction_routes.py'
      - '.claude/instruction-routes.json'
      - '.claude/rules/**'
      - '.claude/hooks/context-router.sh'
      - '.github/workflows/org-core.yml'
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

jobs:
  org-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Org-core block matches its reference
        run: python3 scripts/check-org-core.py --check
      - name: Generated agent files match AGENTS.md
        run: python3 scripts/render-agent-md.py --check
      - name: Routed rules are reachable (portable route kit, ORG-PLAN-331 C11)
        if: hashFiles('scripts/instruction_routes.py') != ''
        run: python3 scripts/instruction_routes.py --check
