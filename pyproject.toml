[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stromy-asset-transport"
version = "0.8.0"
description = "Domain-agnostic content-addressed asset store and outbound delivery ladder shared by Stromy MCP servers"
readme = "README.md"
requires-python = ">=3.11"
# Deliberately NO `license` field. This repository is PUBLIC so that the public
# workflow facade `stromy-org/stromy-workflows-mcp` can install an exact Git tag
# without private-build credentials — public visibility is NOT an open-source
# grant. It matches the source-available posture of `workflow-runtime-core` and
# the facade itself, neither of which carries a licence. The archetype scaffolds
# `license = "MIT"`; that grant is removed here on purpose and must not be
# reintroduced without a separate legal decision (ORG-PLAN-155 task A1).
authors = [{ name = "William Masquelier", email = "william.masquelier@stromy.com.au" }]
dependencies = [
    # Add your runtime dependencies here.
]

[project.optional-dependencies]
# The Azure Blob backend for AssetStore (put/fetch) and the SAS download path in
# delivery.deliver_artifact. Consumers that only use the local-filesystem backend
# (tests/dev) or the SharePoint push path do NOT need this extra.
azure = [
    "azure-storage-blob>=12.19",
    "azure-identity>=1.16",
]
all = ["stromy-asset-transport[azure]"]

# PEP 735 dependency-groups — installed by default with `uv sync` (no --extra needed).
# Azure is included here so pyright (strict) and the test suite can type-check and
# exercise the Azure code paths locally and in CI, while staying an opt-in *runtime*
# extra for consumers.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "pyright>=1.1",
    "stromy-asset-transport[azure]",
]



[tool.hatch.build.targets.wheel]
packages = ["src/stromy_asset_transport"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["ASYNC", "B", "PERF", "S", "E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src/stromy_asset_transport"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Fast, isolated unit tests",
    "contract: Public API contract stability tests",
    "integration: End-to-end tests",
    "real_urlopen: Drives a genuine local HTTP server; keeps the real urllib transport",
    # Add `requires_<dep>` markers as you add optional-dependency-gated tests.
]
